# Alle Klassen unter src/ werden automatisch als Dienste registriert, damit
# Controller, Cronjobs und Listener ohne weitere Einträge greifen. Ausgenommen
# sind die Klassen, die Symfony bzw. der Contao Manager selbst laden, die
# klassischen Frontend-Module (erzeugt Contao selbst), die Ressourcen und die
# reinen Datenträger, die nie als Dienst gebraucht werden.
services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    Schachbulle\ContaoSchachcomputerBundle\:
        resource: '../../'
        exclude:
            - '../../ContaoSchachcomputerBundle.php'
            - '../../ContaoManager/'
            - '../../DependencyInjection/'
            - '../../Module/'
            - '../../Resources/'
            - '../../Partie/Partie.php'
            - '../../Partie/PartieFehler.php'
            - '../../Partie/Spieler.php'
            - '../../Wertung/Wertung.php'
            - '../../Wertung/Spielerstand.php'

    # Öffentlich, weil die klassischen Frontend-Module ihn über den Container holen
    Schachbulle\ContaoSchachcomputerBundle\Partie\Partiedienst:
        public: true

    Schachbulle\ContaoSchachcomputerBundle\Rangliste\Ranglisten:
        public: true

    # Controller müssen öffentlich sein, damit der Router sie abrufen kann
    Schachbulle\ContaoSchachcomputerBundle\Controller\PartieController:
        public: true
        tags: ['controller.service_arguments']

    Schachbulle\ContaoSchachcomputerBundle\Controller\PgnController:
        public: true
        tags: ['controller.service_arguments']

    # Öffentlich, weil Contao den key-Callback aus $GLOBALS['BE_MOD'] über
    # System::importStatic() aus dem Container holt
    Schachbulle\ContaoSchachcomputerBundle\Backend\PartiePgn:
        public: true
